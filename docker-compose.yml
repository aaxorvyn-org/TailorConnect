version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: tailor_marketplace_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: tailor_marketplace
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tailor_marketplace_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DEBUG: "False"
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/tailor_marketplace
      BACKEND_CORS_ORIGINS: "http://localhost,http://localhost:80,http://localhost:5173"
      SECRET_KEY: "change_this_secret_key_in_production_threadcraft_2026"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:8000"
    container_name: tailor_marketplace_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
