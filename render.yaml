services:
  - type: web
    name: threadcraft-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: threadcraft-db
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        value: "*"

databases:
  - name: threadcraft-db
    databaseName: tailor_marketplace
    user: threadcraft_user
    plan: free
